<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Prep Desk</title>
    <meta name="description" content="Aptitude, reasoning and English study notes, shortcut tricks, games and practice in one place.">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#/">
          <span class="brand-mark">P</span>
          <span class="brand-name">Prep Desk<span class="brand-sub">Aptitude · Reasoning · English</span></span>
        </a>
        <nav class="nav-group" id="nav-main"></nav>
        <nav class="nav-group" id="nav-subjects"></nav>
        <nav class="nav-group" id="nav-more"></nav>
        <div class="sidebar-foot">Press <kbd>/</kbd> to search topics</div>
      </aside>

      <div class="main">
        <header class="topbar">
          <a class="brand" href="#/"><span class="brand-mark">P</span><span class="brand-name">Prep Desk</span></a>
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search-input" type="search" placeholder="Search topics and tricks" autocomplete="off" aria-label="Search topics">
            <div id="search-results" class="search-results" hidden></div>
          </div>
          <div class="streak" id="streak" title="Days in a row you studied"></div>
          <div class="user-menu" id="user-menu"></div>
        </header>
        <main class="view" id="view"></main>
      </div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
